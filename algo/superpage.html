<style>
body {
    margin: 0 auto;
    max-height: none;
    background: #ffffff;
    color: #000000;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
}

main{
    margin-inline: auto;
    padding: 0px 100px;
    max-width: 880px;
    background-color: #ffffff;
    font-style: inherit;
    font-size: 18px;
    color:  #5b767c ;
}

.topics {
    display: grid;
    grid-template-rows: auto;
}

.topics  a  {
    text-decoration: none;
    min-width: 0;
}
.section {
    margin: 5px;
    margin-top: 40px;
    max-height: 85px;
    border-bottom: 1px solid #345f8adc;
    font-size: 24px;
    color: #345f8a;
}

.subsection {
    display: block;
    margin: 5px;
    margin-top: 20px;
    max-height: 60px;
    color: #527da9;
    font-size: 18px;
    border-bottom: 1px solid #97bdc2;
}

.layout {
    display: grid;
    grid-template-rows: 80px 1fr;
}

.area1{
    background-color: #ffffff;
}

.area2 {
    background-color: #ffffff;
}

.headder{
    position: fixed;
    top: 0;
    background-color: #ffffff;
    border-bottom: 1px solid #97bdc2;
    width: min(1820px, calc(100% - 40px));
    min-height: 79px;
    padding: 0px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
}

.headder a{
    top: 5px;
    text-decoration: none;
}

.header-nav {
    color: #757575;
}

/* スマホ向け */
@media screen and (max-width: 640px) {

    body {
        width: 100%;
        max-height: none;
        font-size: 16px;
    }

    .layout {
        grid-template-rows: 68px 1fr;
    }

    .headder {
        width: min(100% - 28px, 1080px);
        padding-left: 15px;
        min-height: 60px;
        gap: 12px;
    }

    .headder h4 {
        font-size: 20px;
    }

    .header-nav {
        font-size: 18px;
        top: 50px;
    }

    main {
        box-sizing: border-box;
        width: 100%;
        max-width: 441px;
        margin-inline: auto;
        padding: 0 20px;
        font-size: 16px;
    }

    .topics {
        grid-template-columns: minmax(0, 1fr);
    }

    .section {
        margin: 28px 0 0;
        max-height: none;
        padding-bottom: 8px;
        font-size: 24px;
    }

    .subsection {
        box-sizing: border-box;
        margin: 16px 0 0;
        max-height: none;
        padding: 8px 0;
        font-size: 20px;
        overflow-wrap: anywhere;
    }

    .topics a {
        display: block;
        min-width: 0;
    }
}

</style>
</head>

    </div>

            <a href="/algo/2_4.html"><subsection class = "subsection">2-4：データ構造</subsection></a>
